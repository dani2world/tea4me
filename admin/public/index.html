<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>차4미 관리자</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header">
    <h1>차로 하루를 편집하는 사람 · 관리자</h1>
  </header>

  <main class="main">
    <section class="card">
      <h2>경험/리뷰 글 작성</h2>
      <p class="muted">사진과 메모를 올리면 AI가 초안을 씁니다. 편집 후 직접 발행하세요.</p>

      <form id="experience-form">
        <label class="field">
          <span>사진 (여러 장 가능)</span>
          <input type="file" id="photos-input" name="photos" accept="image/*" multiple required />
        </label>
        <label class="field">
          <span>메모</span>
          <textarea id="memo-input" name="memo" rows="4" placeholder="오늘 마신 차, 장소, 느낀 점을 자유롭게 적어주세요." required></textarea>
        </label>
        <button type="submit" class="btn" id="experience-submit-btn">초안 생성</button>
      </form>

      <div id="experience-progress" class="progress" hidden>
        <p id="experience-progress-text" class="muted"></p>
      </div>

      <div id="experience-editor" class="editor" hidden>
        <img id="editor-cover-preview" class="editor-cover" alt="" />
        <label class="field"><span>제목</span><input type="text" id="editor-title" /></label>
        <label class="field"><span>카테고리</span><input type="text" id="editor-category" /></label>
        <label class="field"><span>태그 (쉼표로 구분)</span><input type="text" id="editor-tags" /></label>
        <label class="field"><span>요약</span><textarea id="editor-excerpt" rows="2"></textarea></label>
        <label class="field"><span>본문</span><textarea id="editor-body" rows="12"></textarea></label>
        <label class="field"><span>표지 이미지 대체 텍스트</span><input type="text" id="editor-alt" /></label>
        <label class="field"><span>나의 한마디 (선택)</span><textarea id="editor-humannote" rows="2"></textarea></label>
        <button type="button" class="btn" id="publish-btn">발행하기</button>
        <p id="publish-result" class="result"></p>
      </div>
    </section>

    <section class="card">
      <h2>정보성 글 자동생성</h2>
      <p class="muted">AI가 아직 다루지 않은 차 주제를 스스로 골라 초안을 씁니다. "나의 한마디"를 직접 작성해야 발행할 수 있습니다.</p>

      <button type="button" class="btn" id="info-generate-btn">정보성 글 생성</button>

      <div id="info-progress" class="progress" hidden>
        <p id="info-progress-text" class="muted"></p>
      </div>

      <div id="info-editor" class="editor" hidden>
        <img id="info-cover-preview" class="editor-cover" alt="" />
        <p id="info-attribution" class="muted"></p>
        <label class="field"><span>제목</span><input type="text" id="info-title" /></label>
        <label class="field"><span>카테고리</span><input type="text" id="info-category" /></label>
        <label class="field"><span>태그 (쉼표로 구분)</span><input type="text" id="info-tags" /></label>
        <label class="field"><span>요약</span><textarea id="info-excerpt" rows="2"></textarea></label>
        <label class="field"><span>본문</span><textarea id="info-body" rows="12"></textarea></label>
        <label class="field"><span>표지 이미지 대체 텍스트</span><input type="text" id="info-alt" /></label>
        <label class="field">
          <span>나의 한마디 (직접 작성 — 필수)</span>
          <textarea id="info-humannote" rows="2" placeholder="이 글에 대한 본인의 생각을 한 문장 이상 적어주세요."></textarea>
        </label>
        <p id="info-gate-warning" class="result" hidden>"나의 한마디"를 작성해야 발행 버튼이 활성화됩니다.</p>
        <button type="button" class="btn" id="info-publish-btn" disabled>발행하기</button>
        <p id="info-publish-result" class="result"></p>
      </div>
    </section>

    <section class="card">
      <h2>발행 파이프라인 테스트</h2>
      <p class="muted">
        경험/정보성 글 파이프라인이 붙기 전, git push 배관이 실제로 동작하는지
        확인하는 임시 버튼입니다.
      </p>
      <button id="test-publish-btn" class="btn">테스트 글 발행</button>
      <p id="test-publish-result" class="result"></p>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
